name: Upstream sync

# Every Monday: bring the newest work of the original Rensaiō (maxpiva/Rensaio, branch main) into this copy.
# If it merges cleanly and the checks pass, a pull request is opened. If not, an issue says what to look at.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, lfs: true }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Fetch the original
        run: |
          git remote add upstream https://github.com/maxpiva/Rensaio.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "UPTODATE=1" >> "$GITHUB_ENV"; echo "Already up to date with the original."
          fi
      - name: Merge
        if: env.UPTODATE != '1'
        run: |
          git config user.name "upstream-sync"; git config user.email "upstream-sync@users.noreply.github.com"
          git checkout -b upstream-sync
          if git merge --no-edit upstream/main; then echo "MERGED=1" >> "$GITHUB_ENV"; else git merge --abort; fi
      - name: Check the chapter rules
        if: env.MERGED == '1'
        run: dotnet run --project tools/tests/ParserCheck && echo "TESTED=1" >> "$GITHUB_ENV"
      - name: Open a pull request
        if: env.TESTED == '1'
        run: |
          git push --force origin upstream-sync
          gh pr list --head upstream-sync --state open --json number --jq 'length' | grep -q '^0$' || { echo "A pull request is already open."; exit 0; }
          gh pr create --head upstream-sync --base main --title "Bring in the original's newest work" \
            --body "The original Rensaiō has new commits. They merged cleanly and the chapter checks pass. Before merging, look at what changed in RensaioBackend/Services/Downloads and Services/Series, where this copy has its own changes (see FORK-NOTES.md), and check that the image still builds."
      - name: Open an issue if it did not merge or the checks failed
        if: env.UPTODATE != '1' && env.TESTED != '1'
        run: |
          gh issue list --label upstream-sync --state open --json number --jq 'length' | grep -q '^0$' || exit 0
          gh label create upstream-sync --color e11d48 --description "The original has new work that needs a hand" 2>/dev/null || true
          gh issue create --label upstream-sync --title "The original has new work that does not merge cleanly" \
            --body "Run: git fetch upstream main && git merge upstream/main, fix the conflicts, run the chapter checks and check that the image builds. This copy's own changes are listed in FORK-NOTES.md."
