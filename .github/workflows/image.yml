name: Build image

# Builds ghcr.io/<owner>/rensaio for amd64 and arm64 on every change to the app, and on demand.
on:
  push:
    branches: [main]
    paths: ["RensaioBackend/**", "RensaioFrontend/**", "Mihon.ExtensionsBridge.Net/**", ".github/workflows/image.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rensaio" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - name: Check the chapter name reader
        run: dotnet run --project tools/tests/ParserCheck
      - name: Frontend
        working-directory: RensaioFrontend
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Package frontend into the backend
        run: |
          (cd RensaioFrontend/out && zip -qr ../../RensaioBackend/wwwroot.zip .)
          sha256sum RensaioBackend/wwwroot.zip | awk '{print toupper($1)}' > RensaioBackend/wwwroot.sha256
      - name: Backend
        run: |
          for rid in linux-x64:amd64 linux-arm64:arm64; do
            dotnet publish RensaioBackend/RensaioBackend.csproj -c Release -r "${rid%%:*}" --self-contained false \
              -p:PublishAot=false -p:PublishReadyToRun=false -p:DebugSymbols=false -o "RensaioBackend/bin/linux/${rid##*:}"
          done
      - uses: docker/build-push-action@v6
        with:
          context: ./RensaioBackend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
